name: Lint

# yggdrasil's lint module: actionlint and zizmor's pedantic audits over the
# workflows, and Semgrep's rule that a tagged Dockerfile FROM carries a digest
# (the generate-image skill's Dockerfile pins its base image that way),
# shellcheck over the scripts, and the docs' links and em dashes. lychee.toml
# leaves out the record template, whose link resolves only once it is copied.
#
# Branch protection requires `Lint / actionlint`, `/ zizmor`, `/ semgrep`,
# `/ shellcheck` and `/ docs` (this job's name, then the module's); renaming
# either strands PRs on a check that never reports.
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint
    uses: zimmertr/yggdrasil/.github/workflows/lint.yml@100f98842aa28262e9e73ebd153af00712bad535 # v3.1.1
    permissions:
      contents: read
