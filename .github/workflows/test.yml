name: Test

# pytest over tests/, on Python 3.9: macOS's own python3 is 3.9, and that is
# what runs the status line on a Mac without Homebrew's. pytest 8.4 is the last
# release that supports 3.9.
on:
  pull_request:
    branches:
      - main

permissions: {}

# A new push makes the run before it moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim@sha256:6ff506466f8b1e981719b468cc0023b8ef000b983cdec0eafe119d01f379e31d # 3.9-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install --no-cache-dir --disable-pip-version-check pytest==8.4.2
      - run: python -m pytest -q tests
